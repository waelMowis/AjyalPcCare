# نشر إصدار جديد من AJYAL PC Care (المثبّت + Release على GitHub) ← كل الأجهزة تشوف «فيه تحديث» وتحدّث لوحدها،
# وأجهزة المعامل اللي عليها المهمة المجدولة بـ /update بتتحدّث صامت بعد الصيانة.
#
# بيشتغل لوحده لما تعدّل ReleaseNotes.md وتعمل Push (اكتب فيه الجديد في الإصدار ده)،
# أو بإيدك من: GitHub ← Actions ← «نشر إصدار» ← Run workflow.
#
# رقم الإصدار = PcBaseVersion (في PCCare.csproj) + رقم تشغيل الـ workflow ده (1، 2، 3 …)
# بعد النشر الإصدارات القديمة بتتمسح — على GitHub بيفضل آخر إصدار بس.
# من جهازك: publish.cmd بيعمل الـ Push ويستنى هنا ويحط المثبّت الجديد في فولدر Releases (ملف واحد بس).
name: نشر إصدار

on:
  push:
    branches: [ master, main ]
    paths: [ 'ReleaseNotes.md' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: فحص إن البرنامج بيفتح (smoke test)
        shell: pwsh
        run: |
          dotnet build PCCare/PCCare.csproj -c Release -o smoke
          $p = Start-Process -FilePath smoke\PCCare.exe -ArgumentList '--smoke-test' -PassThru -RedirectStandardError smoke-err.txt -RedirectStandardOutput smoke-out.txt
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'البرنامج علّق في فحص الفتح' }
          Get-Content smoke-out.txt, smoke-err.txt -ErrorAction SilentlyContinue
          Get-ChildItem smoke\logs -ErrorAction SilentlyContinue | Get-Content -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "البرنامج وقع وهو بيفتح (exit $($p.ExitCode))" }

      - name: Publish + المثبّت
        run: dotnet publish PCCare/PCCare.csproj -p:PublishProfile=Installer -p:PcBuildNumberOverride=${{ github.run_number }}

      - name: Release على GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem Releases -Filter 'PCCare-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'المثبّت ماتعملش' }
          $version = $setup.BaseName -replace '^PCCare-Setup-', ''
          Write-Host "الإصدار: $version  ($([math]::Round($setup.Length / 1MB)) MB)"
          gh release create "v$version" $setup.FullName --title "AJYAL PC Care $version" --notes-file ReleaseNotes.md --latest

      - name: امسح الإصدارات القديمة (يفضل آخر إصدار بس — زي «مسار»)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $latest = gh release view --json tagName -q .tagName
          Write-Host "آخر إصدار (هيفضل): $latest"
          gh release list --limit 200 --json tagName -q '.[].tagName' | ForEach-Object {
            if ($_ -and $_ -ne $latest) {
              Write-Host "مسح $_"
              gh release delete $_ --yes --cleanup-tag
            }
          }
